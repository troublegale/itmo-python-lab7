services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://tasks:tasks@db:5432/tasks
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://tasks:tasks@db:5432/tasks
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks_test
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+asyncpg://tasks:tasks@test-db:5432/tasks_test
      TEST_DATABASE_URL: postgresql+asyncpg://tasks:tasks@test-db:5432/tasks_test
    command: ["sh", "-c", "alembic upgrade head && python -m pytest -v -p no:cacheprovider"]
    depends_on:
      test-db: {condition: service_healthy}
volumes:
  postgres_data:
